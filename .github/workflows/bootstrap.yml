name: Sincronizar evidencia local de M3
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v5
      - name: Integrar evidencia local
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch ./metodos-m3-docs.bundle main:refs/remotes/local/main
          git merge --no-commit refs/remotes/local/main
          git rm metodos-m3-docs.bundle
          git commit -m "Integra la evidencia local de publicación M3"
          git push origin main
